<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThreatGuard - Enhanced Protection</title>
    <style>
        body {
            width: 380px;
            min-height: 500px;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
            color: white;
        }
        
        .header {
            background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #b91c1c;
        }
        
        .header h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .header p {
            margin: 5px 0 0 0;
            font-size: 12px;
            opacity: 0.9;
        }
        
        .content {
            padding: 20px;
        }
        
        .status-card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .status-card h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            font-weight: 600;
            color: #fbbf24;
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 12px;
        }
        
        .status-value {
            font-weight: 600;
            color: #10b981;
        }
        
        .threat-history {
            max-height: 200px;
            overflow-y: auto;
        }
        
        .threat-item {
            background: rgba(220, 38, 38, 0.2);
            border: 1px solid rgba(220, 38, 38, 0.3);
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 8px;
        }
        
        .threat-item h4 {
            margin: 0 0 5px 0;
            font-size: 12px;
            font-weight: 600;
            color: #ef4444;
            word-break: break-all;
        }
        
        .threat-details {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            opacity: 0.8;
        }
        
        .threat-score {
            font-weight: 600;
            color: #fbbf24;
        }
        
        .threat-time {
            color: #9ca3af;
        }
        
        .risk-indicators {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
        }
        
        .risk-item {
            text-align: center;
            padding: 10px;
            border-radius: 6px;
            flex: 1;
            margin: 0 2px;
        }
        
        .risk-safe {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        
        .risk-suspicious {
            background: rgba(245, 158, 11, 0.2);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        
        .risk-malicious {
            background: rgba(220, 38, 38, 0.2);
            border: 1px solid rgba(220, 38, 38, 0.3);
        }
        
        .risk-icon {
            font-size: 20px;
            margin-bottom: 5px;
        }
        
        .risk-label {
            font-size: 10px;
            font-weight: 600;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%);
            color: white;
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, #b91c1c 0%, #dc2626 100%);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .empty-state {
            text-align: center;
            padding: 20px;
            opacity: 0.6;
            font-size: 12px;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            opacity: 0.8;
        }
        
        .content-scanner-info {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 11px;
        }
        
        .scanner-status {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 5px;
        }
        
        .scanner-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🛡️ ThreatGuard</h1>
        <p>Enhanced Real-time Protection</p>
    </div>
    
    <div class="content">
        <!-- Risk Indicators -->
        <div class="risk-indicators">
            <div class="risk-item risk-safe">
                <div class="risk-icon">🟢</div>
                <div class="risk-label">SAFE</div>
            </div>
            <div class="risk-item risk-suspicious">
                <div class="risk-icon">🟡</div>
                <div class="risk-label">SUSPICIOUS</div>
            </div>
            <div class="risk-item risk-malicious">
                <div class="risk-icon">🔴</div>
                <div class="risk-label">MALICIOUS</div>
            </div>
        </div>
        
        <!-- Content Scanner Info -->
        <div class="content-scanner-info">
            <div class="scanner-status">
                <div class="scanner-indicator"></div>
                <span>Content Scanner Active</span>
            </div>
            <div>Scans webpage content for phishing keywords</div>
        </div>
        
        <!-- Current Status -->
        <div class="status-card">
            <h3>📊 Current Status</h3>
            <div class="status-item">
                <span>Protection Status</span>
                <span class="status-value">ACTIVE</span>
            </div>
            <div class="status-item">
                <span>Scanned Pages</span>
                <span class="status-value" id="scannedPages">0</span>
            </div>
            <div class="status-item">
                <span>Threats Blocked</span>
                <span class="status-value" id="threatsBlocked">0</span>
            </div>
        </div>
        
        <!-- Threat History -->
        <div class="status-card">
            <h3>🕒 Recent Threat History</h3>
            <div id="threatHistory" class="threat-history">
                <div class="loading">Loading threat history...</div>
            </div>
        </div>
        
        <!-- Action Buttons -->
        <div class="action-buttons">
            <button class="btn btn-primary" id="clearHistory">Clear History</button>
            <button class="btn btn-secondary" id="refreshData">Refresh</button>
        </div>
    </div>
    
    <script src="popup-enhanced.js"></script>
</body>
</html>

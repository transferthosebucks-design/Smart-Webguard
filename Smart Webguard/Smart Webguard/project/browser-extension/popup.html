<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThreatGuard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 380px;
            min-height: 500px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
        }

        .popup-container {
            background: white;
            border-radius: 12px;
            margin: 10px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .header p {
            font-size: 12px;
            opacity: 0.9;
        }

        .status-section {
            padding: 20px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-text {
            font-weight: 600;
            color: #1e293b;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        .stat-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            text-align: center;
        }

        .stat-number {
            font-size: 24px;
            font-weight: 700;
            color: #4f46e5;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .current-url {
            padding: 15px 20px;
            background: white;
            border-bottom: 1px solid #e2e8f0;
        }

        .url-label {
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .url-text {
            font-size: 12px;
            color: #1e293b;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            background: #f1f5f9;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #e2e8f0;
        }

        .actions-section {
            padding: 20px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: #4f46e5;
            color: white;
        }

        .btn-primary:hover {
            background: #4338ca;
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #e2e8f0;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .blocked-urls {
            padding: 20px;
            background: #fef2f2;
            border-top: 1px solid #fecaca;
        }

        .blocked-urls h3 {
            font-size: 14px;
            color: #991b1b;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .blocked-list {
            max-height: 150px;
            overflow-y: auto;
        }

        .blocked-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            background: white;
            border-radius: 4px;
            margin-bottom: 5px;
            font-size: 11px;
        }

        .blocked-url-text {
            flex: 1;
            word-break: break-all;
            color: #7f1d1d;
            margin-right: 8px;
        }

        .unblock-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            cursor: pointer;
        }

        .unblock-btn:hover {
            background: #b91c1c;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #64748b;
            font-size: 14px;
        }

        .footer {
            padding: 15px 20px;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
            text-align: center;
        }

        .footer-text {
            font-size: 11px;
            color: #64748b;
        }

        .footer-link {
            color: #4f46e5;
            text-decoration: none;
        }

        .footer-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="popup-container">
        <div class="header">
            <h1>🛡️ ThreatGuard</h1>
            <p>Real-time Malicious Website Protection</p>
        </div>

        <div class="status-section">
            <div class="status-indicator">
                <div class="status-dot"></div>
                <div class="status-text">Protection Active</div>
            </div>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="blocked-count">0</div>
                    <div class="stat-label">URLs Blocked</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="threshold">70</div>
                    <div class="stat-label">Threat Threshold</div>
                </div>
            </div>
        </div>

        <div class="current-url">
            <div class="url-label">Current Page</div>
            <div class="url-text" id="current-url">Loading...</div>
        </div>

        <div class="actions-section">
            <button class="btn btn-primary" id="analyze-btn">
                🔍 Analyze Current URL
            </button>
            <button class="btn btn-secondary" id="view-blocked-btn">
                📋 View Blocked URLs
            </button>
            <button class="btn btn-danger" id="clear-blocked-btn">
                🗑️ Clear All Blocked URLs
            </button>
        </div>

        <div class="blocked-urls" id="blocked-urls-section" style="display: none;">
            <h3>🚫 Blocked URLs</h3>
            <div class="blocked-list" id="blocked-list">
                <!-- Blocked URLs will be populated here -->
            </div>
        </div>

        <div class="footer">
            <div class="footer-text">
                Protected by <a href="#" class="footer-link">Cyber Phoenix</a>
            </div>
        </div>
    </div>

    <script>
        class ThreatGuardPopup {
            constructor() {
                this.init();
            }

            async init() {
                await this.loadStats();
                await this.loadCurrentURL();
                await this.loadBlockedURLs();
                this.setupEventListeners();
            }

            async loadStats() {
                try {
                    const response = await chrome.runtime.sendMessage({ action: 'getStats' });
                    if (response && !response.error) {
                        document.getElementById('blocked-count').textContent = response.blockedURLs;
                        document.getElementById('threshold').textContent = response.threatThreshold;
                    }
                } catch (error) {
                    console.error('Error loading stats:', error);
                }
            }

            async loadCurrentURL() {
                try {
                    const [tab] = await chrome.tabs.query({ active: true, currentWindow: true });
                    if (tab && tab.url) {
                        const urlElement = document.getElementById('current-url');
                        urlElement.textContent = this.truncateURL(tab.url, 50);
                        urlElement.title = tab.url;
                    }
                } catch (error) {
                    console.error('Error loading current URL:', error);
                    document.getElementById('current-url').textContent = 'Unable to detect';
                }
            }

            async loadBlockedURLs() {
                try {
                    const response = await chrome.runtime.sendMessage({ action: 'getBlockedURLs' });
                    if (response && !response.error) {
                        this.displayBlockedURLs(response);
                    }
                } catch (error) {
                    console.error('Error loading blocked URLs:', error);
                }
            }

            displayBlockedURLs(blockedURLs) {
                const blockedList = document.getElementById('blocked-list');
                const blockedSection = document.getElementById('blocked-urls-section');

                if (blockedURLs.length === 0) {
                    blockedList.innerHTML = '<div style="text-align: center; color: #64748b; padding: 20px; font-size: 12px;">No blocked URLs yet</div>';
                } else {
                    blockedList.innerHTML = blockedURLs.slice(0, 10).map(url => `
                        <div class="blocked-item">
                            <div class="blocked-url-text">${this.truncateURL(url, 30)}</div>
                            <button class="unblock-btn" data-url="${url}">Unblock</button>
                        </div>
                    `).join('');

                    // Add unblock event listeners
                    blockedList.querySelectorAll('.unblock-btn').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            const url = e.target.dataset.url;
                            this.unblockURL(url);
                        });
                    });
                }
            }

            setupEventListeners() {
                // Analyze current URL button
                document.getElementById('analyze-btn').addEventListener('click', async () => {
                    const [tab] = await chrome.tabs.query({ active: true, currentWindow: true });
                    if (tab && tab.url) {
                        this.analyzeURL(tab.url);
                    }
                });

                // View blocked URLs button
                document.getElementById('view-blocked-btn').addEventListener('click', () => {
                    const blockedSection = document.getElementById('blocked-urls-section');
                    blockedSection.style.display = blockedSection.style.display === 'none' ? 'block' : 'none';
                });

                // Clear blocked URLs button
                document.getElementById('clear-blocked-btn').addEventListener('click', () => {
                    if (confirm('Are you sure you want to clear all blocked URLs? This will remove all protection.')) {
                        this.clearBlockedURLs();
                    }
                });
            }

            async analyzeURL(url) {
                const analyzeBtn = document.getElementById('analyze-btn');
                const originalText = analyzeBtn.innerHTML;
                analyzeBtn.innerHTML = '⏳ Analyzing...';
                analyzeBtn.disabled = true;

                try {
                    // Send analysis request to background script
                    const response = await chrome.runtime.sendMessage({
                        action: 'analyzeURL',
                        url: url
                    });

                    if (response && !response.error) {
                        this.showAnalysisResult(response);
                    } else {
                        this.showMessage('Analysis failed: ' + (response?.error || 'Unknown error'), 'error');
                    }
                } catch (error) {
                    console.error('Error analyzing URL:', error);
                    this.showMessage('Analysis failed: ' + error.message, 'error');
                } finally {
                    analyzeBtn.innerHTML = originalText;
                    analyzeBtn.disabled = false;
                }
            }

            async unblockURL(url) {
                try {
                    const response = await chrome.runtime.sendMessage({
                        action: 'unblockURL',
                        url: url
                    });

                    if (response && response.success) {
                        this.showMessage('URL unblocked successfully', 'success');
                        await this.loadBlockedURLs();
                        await this.loadStats();
                    } else {
                        this.showMessage('Failed to unblock URL', 'error');
                    }
                } catch (error) {
                    console.error('Error unblocking URL:', error);
                    this.showMessage('Failed to unblock URL', 'error');
                }
            }

            async clearBlockedURLs() {
                try {
                    const response = await chrome.runtime.sendMessage({ action: 'clearBlockedURLs' });

                    if (response && response.success) {
                        this.showMessage('All blocked URLs cleared', 'success');
                        await this.loadBlockedURLs();
                        await this.loadStats();
                    } else {
                        this.showMessage('Failed to clear blocked URLs', 'error');
                    }
                } catch (error) {
                    console.error('Error clearing blocked URLs:', error);
                    this.showMessage('Failed to clear blocked URLs', 'error');
                }
            }

            showAnalysisResult(analysis) {
                const message = `
                    Analysis Results:
                    Risk Level: ${analysis.riskLevel}
                    Threat Score: ${analysis.score}/100
                    Category: ${analysis.category}
                `;

                if (analysis.score >= 70) {
                    this.showMessage('⚠️ ' + message, 'warning');
                } else {
                    this.showMessage('✅ ' + message, 'success');
                }
            }

            showMessage(message, type) {
                // Create a simple message display
                const messageDiv = document.createElement('div');
                messageDiv.style.cssText = `
                    position: fixed;
                    top: 10px;
                    left: 10px;
                    right: 10px;
                    padding: 10px;
                    border-radius: 4px;
                    font-size: 12px;
                    z-index: 1000;
                    background: ${type === 'error' ? '#fef2f2' : type === 'warning' ? '#fef3c7' : '#f0fdf4'};
                    color: ${type === 'error' ? '#991b1b' : type === 'warning' ? '#92400e' : '#166534'};
                    border: 1px solid ${type === 'error' ? '#fecaca' : type === 'warning' ? '#fde68a' : '#bbf7d0'};
                `;
                messageDiv.textContent = message;

                document.body.appendChild(messageDiv);

                setTimeout(() => {
                    if (messageDiv.parentNode) {
                        messageDiv.parentNode.removeChild(messageDiv);
                    }
                }, 3000);
            }

            truncateURL(url, maxLength) {
                if (url.length <= maxLength) return url;
                return url.substring(0, maxLength) + '...';
            }
        }

        // Initialize popup when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new ThreatGuardPopup();
        });
    </script>
</body>
</html>
